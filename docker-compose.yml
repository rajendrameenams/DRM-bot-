version: '3.8'

services:
  drm-bot:
    build: .
    container_name: telegram_drm_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./DOWNLOADS:/app/DOWNLOADS
      - ./SESSIONS:/app/SESSIONS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

